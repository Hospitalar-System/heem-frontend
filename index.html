<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- PROVISÓRIO: favicon e imagem Open Graph serão trocados quando a identidade visual for definida. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F1F1F" />
    <!--
      Valores PADRÃO e neutros de produto, para crawlers que não executam JavaScript. Cada rota pública da landing
      redefine título e metas no cliente (src/features/landing/useDocumentHead.ts) e restaura estes valores ao sair.
      O marcador de URL do site nos valores abaixo é trocado no build por VITE_SITE_URL (vazio = URL relativa). Ver vite.config.ts.
    -->
    <meta name="description" content="Gestão de engenharia clínica hospitalar: equipamentos, chamados, ordens de serviço e conformidade." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Gestão de engenharia clínica" />
    <meta property="og:description" content="Gestão de engenharia clínica hospitalar: equipamentos, chamados, ordens de serviço e conformidade." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-landing.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gestão de engenharia clínica" />
    <meta name="twitter:description" content="Gestão de engenharia clínica hospitalar: equipamentos, chamados, ordens de serviço e conformidade." />
    <meta name="twitter:image" content="__SITE_URL__/og-landing.png" />
    <title>Gestão de engenharia clínica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
